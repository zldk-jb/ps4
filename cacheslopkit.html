<!DOCTYPE html>
<html manifest="slopkit.manifest">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080e2c">
<title>ZoLDiK — Offline Cache</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="cache-page">
<script>
history.replaceState(null,null,'index.html');var histlength=history.length;history.go(-histlength);
function DLProgress(e){Percent=(Math.round(e.loaded / e.total * 100));window.msgs.innerHTML="Installing Offline Cache: " + Percent + "%";}
function DisplayCacheProgress(){window.msgs.innerHTML="Cache Installed Successfully ✔";setTimeout(function(){window.msgs.innerHTML="Now Close And Re-Open Your Browser ...";},1500);}
window.applicationCache.addEventListener("progress",DLProgress,false);
window.applicationCache.oncached=function(e){DisplayCacheProgress();};
window.applicationCache.onupdateready=function(e){DisplayCacheProgress();};
window.applicationCache.onerror=function(e){window.msgs.innerHTML="Error Installing Cache! - Clear and Re-Open Your Browser ...";};
</script>
<main class="cache-wrap"><h1 class="cache-title">Offline Cache</h1><div class="cache-track" aria-hidden="true"><span></span></div><div class="status-card"><div class="status-icon" aria-hidden="true">↓</div><div class="status-content"><div class="status-head"><span class="spec-label">OFFLINE CACHE</span></div><h2 id="msgs" class="cache-msg" role="status" aria-live="polite">Starting Cache Installation...</h2><p class="cache-hint">Keep this page open until installation is complete.</p></div></div></main><footer class="bottom-bar"><span class="symbols" aria-hidden="true">△ &nbsp; ○ &nbsp; × &nbsp; □</span></footer>
</body>
</html>
